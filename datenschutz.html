<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Datenschutzerklärung · Fachinformatiker-Trainer App</title>
<meta name="robots" content="noindex" />
<style>
  :root { color-scheme: light dark; --bg: #F2F2F7; --card: #fff; --text: #000; --muted: rgba(60,60,67,.65); --accent: #EA6A1F; }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1C1C1E; --text: #fff; --muted: rgba(235,235,245,.6); } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  header img { width: 48px; height: 48px; border-radius: 12px; }
  header strong { font-size: 17px; }
  header span { display: block; font-size: 14px; color: var(--muted); }
  nav { display: flex; gap: 16px; margin-bottom: 20px; font-size: 15px; }
  a { color: var(--accent); }
  .legal-text { background: var(--card); border-radius: 18px; padding: 24px 20px; margin-bottom: 16px; }
  h2 { font-size: 26px; line-height: 1.2; margin: 0 0 8px; }
  h3 { font-size: 17px; margin: 22px 0 6px; }
  p { margin: 0 0 10px; }
  .legal-muted { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header><img src="icon.png" alt=""><div><strong>Fachinformatiker-Trainer</strong><span>App für iPhone und iPad</span></div></header>
  <nav><a href="datenschutz.html">Datenschutz</a><a href="agb.html">AGB &amp; Widerruf</a><a href="impressum.html">Impressum</a></nav>
  <div id="inhalt"></div>
</main>
<script src="config.js"></script>
<script src="legal.js"></script>
<script>
  document.getElementById('inhalt').innerHTML = 'datenschutz'.split(',').map(t => AppLegal[t](APP_CONFIG.anbieter)).join('');
</script>
</body>
</html>
